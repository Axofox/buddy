<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden">
      <div id="bubble-text"></div>
      <button id="bubble-join" class="hidden">Join call</button>
      <div id="bubble-hint">click to close</div>
    </div>

    <form id="cal-form" class="panel hidden" autocomplete="off">
      <div class="panel-title">Paste your calendar's secret address</div>
      <div class="row">
        <input id="cal-url" placeholder="https://calendar.google.com/…/basic.ics" spellcheck="false">
        <button type="submit">OK</button>
      </div>
      <a id="cal-help" href="#">Where do I find it?</a>
      <div id="cal-error" class="error"></div>
    </form>

    <form id="ask-form" class="panel hidden" autocomplete="off">
      <input id="ask-text" placeholder="Ask me anything…" maxlength="2000">
      <button type="submit">↑</button>
    </form>

    <form id="remind-form" class="panel hidden" autocomplete="off">
      <input id="remind-text" placeholder="Remind me to…" maxlength="200">
      <div class="row">
        <input id="remind-when" placeholder="10m, 1h30, 14:30, 2pm">
        <button type="submit">OK</button>
      </div>
      <div id="remind-error" class="error"></div>
    </form>

    <div id="sparks"></div>
    <div id="ball-wrap">
      <div id="ball-squash">
        <div id="grow">
        <svg id="ball" viewBox="0 0 100 100" width="48" height="48">
          <defs>
            <!-- warm, golden glow toward the tips -->
            <linearGradient id="tipglow" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd36b" stop-opacity="0.8"/>
              <stop offset="0.2" stop-color="#ffb347" stop-opacity="0.45"/>
              <stop offset="0.46" stop-color="#ff9a3c" stop-opacity="0"/>
            </linearGradient>
            <path id="flame">
              <!-- the shape and its swaying come from shapes.js; faster while you type -->
              <animate id="sway" attributeName="d" dur="2.6s" repeatCount="indefinite"
                calcMode="spline" keyTimes="0;0.25;0.5;0.75;1"
                keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
            </path>
          </defs>
          <!-- the pet's body; its shape changes as it grows (shapes.js) -->
          <g id="extra-back"></g>
          <use href="#flame" class="body"/>
          <use href="#flame" class="tips"/>
          <g id="extra-front"></g>

          <g id="face">
          <!-- open eyes: white dots with pupils that follow the cursor -->
          <g id="eyes">
            <g class="eye" transform="translate(33 64)">
              <circle class="white" r="9"/>
              <g class="pupil"><circle r="5"/></g>
              <path class="lid" d="M-10 -1 H10 V-11 H-10 Z"/>
            </g>
            <g class="eye" transform="translate(67 64)">
              <circle class="white" r="9"/>
              <g class="pupil"><circle r="5"/></g>
              <path class="lid" d="M-10 -1 H10 V-11 H-10 Z"/>
            </g>
          </g>
          <g id="eyes-closed" class="feature">
            <path d="M25 64 Q33 69 41 64"/><path d="M59 64 Q67 69 75 64"/>
          </g>
          <g id="eyes-heart" class="feature">
            <path d="M33 71 l-8 -8 a4.5 4.5 0 0 1 8 -5 a4.5 4.5 0 0 1 8 5 z"/>
            <path d="M67 71 l-8 -8 a4.5 4.5 0 0 1 8 -5 a4.5 4.5 0 0 1 8 5 z"/>
          </g>

          <!-- mouths: tiny, between the eyes -->
          <path class="mouth m-happy" d="M45 66 Q50 71 55 66"/>
          <path class="mouth m-excited filled" d="M43 62 Q50 58 57 62 Q60 72 50 75 Q40 72 43 62 Z"/>
          <ellipse class="mouth m-alert filled" cx="50" cy="69" rx="3.5" ry="4.5"/>
          <circle class="mouth m-surprised filled" cx="50" cy="69" r="2"/>
          <path class="mouth m-sleepy" d="M46 68 L54 68"/>
          <circle class="mouth m-sleep filled" cx="50" cy="70" r="2"/>
          <path class="mouth m-hungry" d="M45 67 Q48 64 50 67 Q52 64 55 67"/>
          <path class="mouth m-love" d="M45 66 Q50 71 55 66"/>
          <path class="mouth m-sad" d="M45 69 Q50 64 55 69"/>
          <path class="mouth m-sly" d="M45 67 Q51 70 56 65"/>
          <path class="mouth m-thinking" d="M46 69 L54 67"/>
          <!-- joy: a big round "wooo!" mouth -->
          <g class="mouth m-joy">
            <path class="filled" d="M41 64 Q42 56 50 56 Q59 56 59 65 Q59 76 50 77 Q41 76 41 64 Z"/>
            <path d="M47 67 q1 -4 5 -3 q3 2 0 5 q-3 2 -4 -1" fill="none" stroke="#ff7a8a" stroke-width="2.4" stroke-linecap="round"/>
          </g>
          <!-- angry: lopsided open mouth and frowning brows -->
          <path class="mouth m-angry filled" d="M43 75 Q43 66 51 66 Q58 66 58 73 Q55 71 51 72 Q46 72 43 75 Z"/>
          <g id="brows" class="feature"><path d="M22 48 L42 55"/><path d="M78 48 L58 55"/></g>
          </g>

          <!-- holiday outfits (only one shows at a time) -->
          <g id="outfit-halloween" class="outfit">
            <g transform="translate(96 82)">
              <path d="M-1 -12 q1 -6 5 -7" fill="none" stroke="#3f6b2a" stroke-width="3" stroke-linecap="round"/>
              <ellipse rx="15" ry="12" fill="#f28a1e"/>
              <ellipse rx="7" ry="12" fill="#e0761a"/>
              <ellipse rx="2.5" ry="12" fill="#f5973a"/>
              <path d="M-9 -3 l3 -4 3 4 z M3 -3 l3 -4 3 4 z" fill="#3b2410"/>
              <path d="M-8 3 q8 7 16 0 l-3 0 -2 2 -2 -2 -2 2 -2 -2 z" fill="#3b2410"/>
            </g>
          </g>
          <!-- things that sit on the head move with its height -->
          <g id="head">
          <g id="outfit-christmas" class="outfit">
            <path d="M34 22 Q40 -4 66 -10 Q78 -12 80 0 Q70 -4 64 4 Q60 12 68 22 Z" fill="#e23b3b"/>
            <rect x="30" y="18" width="42" height="9" rx="4.5" fill="#fff"/>
            <circle cx="80" cy="1" r="5.5" fill="#fff"/>
          </g>
          <g id="outfit-newyear" class="outfit">
            <path d="M40 22 L56 -16 L68 20 Z" fill="#7b5cff"/>
            <path d="M47 6 L60 2 M44 14 L64 9 M51 -3 L58 -6" stroke="#ffd36b" stroke-width="3" stroke-linecap="round"/>
            <rect x="38" y="18" width="32" height="6" rx="3" fill="#ffd36b"/>
            <circle cx="56" cy="-17" r="4" fill="#ff5fa2"/>
            <rect x="10" y="10" width="4" height="4" fill="#ffd36b" transform="rotate(20 12 12)"/>
            <rect x="86" y="24" width="4" height="4" fill="#5fd3ff" transform="rotate(-15 88 26)"/>
            <rect x="92" y="6" width="3" height="3" fill="#ff5fa2"/>
          </g>
          <!-- sleeping: a subtle zzz drifting up above the head -->
          <g id="zzz" class="feature">
            <text class="z z1" x="56" y="-2">z</text>
            <text class="z z2" x="63" y="-11">z</text>
            <text class="z z3" x="71" y="-21">z</text>
          </g>
          </g>
          <g id="outfit-valentine" class="outfit">
            <path d="M92 76 l-9 -9 a5 5 0 0 1 9 -6 a5 5 0 0 1 9 6 z" fill="#ff4d6d"/>
            <path d="M8 44 l-5 -5 a3 3 0 0 1 5 -3.5 a3 3 0 0 1 5 3.5 z" fill="#ff8fa3"/>
          </g>

          <!-- extras -->
          <text id="exclaim" class="feature" x="84" y="30">!</text>
        </svg>
        </div>
      </div>
    </div>
  </div>
  <script src="shapes.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
