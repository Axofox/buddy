<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden">
      <div id="bubble-text"></div>
      <div id="bubble-hint">click to dismiss</div>
    </div>

    <form id="remind-form" class="hidden" autocomplete="off">
      <input id="remind-text" placeholder="Remind me to…" maxlength="200">
      <div class="row">
        <input id="remind-when" placeholder="10m, 1h30, 14:30, 2pm">
        <button type="submit">OK</button>
      </div>
      <div id="remind-error"></div>
    </form>

    <div id="ball-wrap">
      <div id="ball-squash">
        <svg id="ball" viewBox="0 0 100 100" width="48" height="48">
          <circle class="body" cx="50" cy="50" r="46"/>

          <!-- open eyes: plain dots that follow the cursor -->
          <g id="eyes">
            <g class="eye" transform="translate(35 44)"><g class="pupil"><ellipse rx="6" ry="8"/></g></g>
            <g class="eye" transform="translate(65 44)"><g class="pupil"><ellipse rx="6" ry="8"/></g></g>
          </g>
          <g id="eyes-closed" class="feature">
            <path d="M27 46 Q35 51 43 46"/><path d="M57 46 Q65 51 73 46"/>
          </g>
          <g id="eyes-squint" class="feature">
            <path d="M28 47 Q35 38 42 47"/><path d="M58 47 Q65 38 72 47"/>
          </g>
          <g id="eyes-heart" class="feature">
            <path d="M35 52 l-8 -8 a4.5 4.5 0 0 1 8 -5 a4.5 4.5 0 0 1 8 5 z"/>
            <path d="M65 52 l-8 -8 a4.5 4.5 0 0 1 8 -5 a4.5 4.5 0 0 1 8 5 z"/>
          </g>

          <!-- mouths -->
          <path class="mouth m-happy" d="M42 65 Q50 72 58 65"/>
          <path class="mouth m-excited filled" d="M39 63 Q50 80 61 63 Z"/>
          <ellipse class="mouth m-alert filled" cx="50" cy="68" rx="5" ry="6"/>
          <ellipse class="mouth m-surprised filled" cx="50" cy="68" rx="4" ry="5"/>
          <path class="mouth m-sleepy" d="M45 67 L55 67"/>
          <ellipse class="mouth m-sleep filled" cx="50" cy="67" rx="3" ry="2.5"/>
          <path class="mouth m-hungry filled" d="M40 63 Q50 79 60 63 Z"/>
          <path class="mouth m-love" d="M42 64 Q50 73 58 64"/>
          <path class="mouth m-sad" d="M42 70 Q50 63 58 70"/>

          <!-- extras -->
          <text id="exclaim" class="feature" x="84" y="16">!</text>
          <g id="zzz" class="feature"><text x="78" y="20">z</text><text x="90" y="6">z</text></g>
        </svg>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
